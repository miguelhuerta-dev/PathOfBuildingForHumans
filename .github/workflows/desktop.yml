name: Desktop app (Windows portable)

# Runs only on demand (Actions tab → Run workflow) or when a version tag is pushed.
# It builds the single-file Windows app and keeps it as a workflow artifact
# (with the version's release notes, for a tag); the release itself is published
# by hand from that file. After a successful build, artifacts of earlier runs
# are deleted so they do not fill the account's Actions storage.
#
# Code signing (SignPath Foundation, see CODE_SIGNING_POLICY.md) runs once the
# repository has the variable SIGNPATH_ORGANIZATION_ID and the secret
# SIGNPATH_API_TOKEN; until then the app is published unsigned, as before.
# Tags are signed with the "release-signing" policy, other runs with "test-signing".
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Prepare calculation engine
        shell: pwsh
        # The work dir is kept so the smoke test can read PoB's test builds from it.
        run: ./scripts/setup-engine.ps1 -WorkDir (Join-Path $env:RUNNER_TEMP "engine-src")

      - name: Smoke-test the engine
        shell: pwsh
        working-directory: src-tauri/engine/pob/src
        run: |
          $env:LUA_PATH = "../runtime/lua/?.lua;../runtime/lua/?/init.lua;./?.lua"
          $env:LUA_CPATH = "../../?.dll"
          # ReadAllText gives a plain string; Get-Content adds properties that ConvertTo-Json can serialize.
          $xml = [IO.File]::ReadAllText("$env:RUNNER_TEMP/engine-src/pob/spec/TestBuilds/3.13/OccVortex.xml")
          @{ kind = "build"; xml = $xml } | ConvertTo-Json -Compress | Set-Content -Encoding utf8 "$env:RUNNER_TEMP/smoke.json"
          $out = ../../luajit.exe ../../pobh_engine.lua "$env:RUNNER_TEMP/smoke.json"
          if (-not ($out -match "@@POBH_RESULT@@")) { Write-Output $out; exit 1 }

      - name: Install dependencies
        run: npm ci

      - name: Build the single-file app
        shell: pwsh
        run: |
          $name = if ($env:GITHUB_REF_TYPE -eq "tag") { "PathOfBuildingForHumans-$env:GITHUB_REF_NAME-windows.exe" } else { "PathOfBuildingForHumans-windows.exe" }
          ./scripts/build-portable.ps1 -OutFile "portable/$name"

      # The unsigned app, handed to SignPath; it is kept with the run only as signing input.
      - name: Upload the app for signing
        id: unsigned
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-app
          path: portable/*.exe
          retention-days: 1
          if-no-files-found: error

      - name: Sign the app
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'PathOfBuildingForHumans' }}
          signing-policy-slug: ${{ github.ref_type == 'tag' && 'release-signing' || 'test-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # A release waits for the approver, so give them time.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: portable/signed

      - name: Use the signed app
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        run: |
          $signed = Get-ChildItem portable/signed -Filter *.exe -Recurse
          if (-not $signed) { throw "SignPath returned no signed app." }
          foreach ($file in $signed) { Move-Item $file.FullName (Join-Path portable $file.Name) -Force }
          Remove-Item portable/signed -Recurse -Force
          $status = (Get-AuthenticodeSignature (Get-ChildItem portable -Filter *.exe | Select-Object -First 1).FullName).Status
          Write-Output "Signature: $status"

      - name: Release notes
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          SIGNED: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        run: |
          # This version's section of CHANGELOG.md ("## v0.3.0" up to the next "## "), ready to paste in the release.
          $changelog = [IO.File]::ReadAllText((Resolve-Path CHANGELOG.md)) -replace "`r`n", "`n"
          $section = [regex]::Match($changelog, "(?ms)^## $([regex]::Escape($env:GITHUB_REF_NAME))\s*\n(.*?)(?=^## |\z)")
          if (-not $section.Success) { throw "CHANGELOG.md has no section for $env:GITHUB_REF_NAME." }
          $notes = $section.Groups[1].Value.Trim()
          # SignPath Foundation asks every signed release to say who signed it.
          if ($env:SIGNED -eq "true") {
            $notes += "`n`nFree code signing provided by [SignPath.io](https://about.signpath.io/), certificate by [SignPath Foundation](https://signpath.org/)."
          }
          [IO.File]::WriteAllText((Join-Path (Resolve-Path portable) "release-notes-$env:GITHUB_REF_NAME.md"), $notes)

      - uses: actions/upload-artifact@v4
        with:
          name: PathOfBuildingForHumans-${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}-windows
          path: |
            portable/*.exe
            portable/*.md
          retention-days: 7
          if-no-files-found: error

  clean-up:
    # Only after a successful build, so a failed run never removes the last good app.
    needs: windows-portable
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Delete artifacts of earlier runs
        run: |
          gh api --paginate "repos/$GH_REPO/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.workflow_run.id != $GITHUB_RUN_ID) | .id" |
          while read -r id; do
            gh api -X DELETE "repos/$GH_REPO/actions/artifacts/$id"
            echo "Deleted artifact $id"
          done
