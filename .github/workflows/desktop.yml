name: Desktop app (Windows portable)

# Runs only on demand (Actions tab → Run workflow) or when a version tag is pushed.
# A tag publishes a GitHub Release with the single-file app; a manual run keeps
# the app as a short-lived workflow artifact. Older artifacts and releases are
# removed afterwards so they do not fill the account's storage.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows-portable:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: frontend/frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/frontend/src-tauri -> target

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Prepare calculation engine
        shell: pwsh
        # The work dir is kept so the smoke test can read PoB's test builds from it.
        run: ./scripts/setup-engine.ps1 -WorkDir (Join-Path $env:RUNNER_TEMP "engine-src")

      - name: Smoke-test the engine
        shell: pwsh
        working-directory: frontend/frontend/src-tauri/engine/pob/src
        run: |
          $env:LUA_PATH = "../runtime/lua/?.lua;../runtime/lua/?/init.lua;./?.lua"
          $env:LUA_CPATH = "../../?.dll"
          # ReadAllText gives a plain string; Get-Content adds properties that ConvertTo-Json can serialize.
          $xml = [IO.File]::ReadAllText("$env:RUNNER_TEMP/engine-src/pob/spec/TestBuilds/3.13/OccVortex.xml")
          @{ kind = "build"; xml = $xml } | ConvertTo-Json -Compress | Set-Content -Encoding utf8 "$env:RUNNER_TEMP/smoke.json"
          $out = ../../luajit.exe ../../pobh_engine.lua "$env:RUNNER_TEMP/smoke.json"
          if (-not ($out -match "@@POBH_RESULT@@")) { Write-Output $out; exit 1 }

      - name: Install dependencies
        run: npm ci

      - name: Build the single-file app
        shell: pwsh
        run: |
          $name = if ($env:GITHUB_REF_TYPE -eq "tag") { "PathOfBuildingForHumans-$env:GITHUB_REF_NAME-windows.exe" } else { "PathOfBuildingForHumans-windows.exe" }
          ./scripts/build-portable.ps1 -OutFile "portable/$name"

      - name: Publish the release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          # Add a RELEASE_TOKEN secret (a personal access token with Contents:
          # write) for the release to be published under your account; without
          # it the release is published by github-actions.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          # The release notes are this version's section of CHANGELOG.md ("## v0.3.0" up to the next "## ").
          $changelog = [IO.File]::ReadAllText((Resolve-Path ../../CHANGELOG.md)) -replace "`r`n", "`n"
          $section = [regex]::Match($changelog, "(?ms)^## $([regex]::Escape($env:GITHUB_REF_NAME))\s*\n(.*?)(?=^## |\z)")
          if (-not $section.Success) { throw "CHANGELOG.md has no section for $env:GITHUB_REF_NAME." }
          $notes = Join-Path $env:RUNNER_TEMP "release-notes.md"
          [IO.File]::WriteAllText($notes, $section.Groups[1].Value.Trim())
          gh release create $env:GITHUB_REF_NAME (Get-ChildItem portable/*.exe).FullName --title $env:GITHUB_REF_NAME --notes-file $notes

      - uses: actions/upload-artifact@v4
        if: github.ref_type != 'tag'
        with:
          name: PathOfBuildingForHumans-windows-portable
          path: frontend/frontend/portable/*.exe
          retention-days: 7
          if-no-files-found: error

  clean-up:
    # Only after a successful build, so a failed run never removes the last good app.
    needs: windows-portable
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Delete artifacts of earlier runs
        run: |
          gh api --paginate "repos/$GH_REPO/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.workflow_run.id != $GITHUB_RUN_ID) | .id" |
          while read -r id; do
            gh api -X DELETE "repos/$GH_REPO/actions/artifacts/$id"
            echo "Deleted artifact $id"
          done

      - name: Delete older releases (their git tags are kept)
        if: github.ref_type == 'tag'
        run: |
          gh release list --limit 1000 --json tagName --jq '.[].tagName' |
          while read -r tag; do
            if [ "$tag" != "$GITHUB_REF_NAME" ]; then
              gh release delete "$tag" --yes
              echo "Deleted release $tag"
            fi
          done
