name: Quality checks

# Tests, lint, types and a build on every push and pull request, so nothing
# breaks silently. Fast and free of artifacts: the app itself is built by
# desktop.yml, only on demand or for a version tag.
# The same checks run locally with `npm run check`.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Tests (app)
        run: npm test

      - name: Lint
        run: npm run lint

      # Type check and the web build; the desktop crate embeds this build, so it comes first.
      - name: Types and build
        run: npm run build

      - name: Tests (desktop)
        working-directory: src-tauri
        run: cargo test --lib --locked

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --lib --locked -- -D warnings
